<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quên Mật Khẩu - KangMusic')}"></head>
<body class="auth-page" hx-boost="false">

<div class="auth-wrapper">
    <div class="auth-logo">
        <a th:href="@{/}">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="#1ed760">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
            </svg>
            <span class="auth-logo-text">KangMusic</span>
        </a>
    </div>

    <div class="auth-container" style="max-width: 440px;">
        <h2>🔒 Quên Mật Khẩu</h2>

        <p style="text-align:center; color:var(--sp-text-muted); font-size:14px; margin-bottom:24px; line-height:1.6;">
            Nhập email của bạn, chúng tôi sẽ gửi đường dẫn để đặt lại mật khẩu.
        </p>

        <div th:if="${error}" class="auth-alert auth-alert-error">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="auth-alert auth-alert-success">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label>Địa chỉ Email của bạn</label>
                <input type="email" name="email" required placeholder="Nhập email đã đăng ký...">
            </div>

            <!-- Image-based CAPTCHA -->
            <div class="form-group">
                <label style="margin-bottom: 8px; display: block;">
                    🖼️ Chọn tất cả hình ảnh chứa <strong th:text="${captchaTarget}" style="color: #1ed760;">mục tiêu</strong>
                </label>
                <div class="captcha-grid" id="captcha-grid">
                    <div th:each="img, stat : ${captchaImages}" 
                         class="captcha-cell"
                         th:data-index="${stat.index}"
                         onclick="toggleCaptchaCell(this)">
                        <img th:src="${img}" alt="captcha image" draggable="false"/>
                        <div class="captcha-check-overlay">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <input type="checkbox" name="selectedImages" th:value="${stat.index}" style="display:none;" class="captcha-checkbox"/>
                    </div>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;">
                    <span style="font-size: 11px; color: rgba(255,255,255,0.4);">Chọn đúng để tiếp tục</span>
                    <button type="button" onclick="window.location.reload()" 
                            style="background: transparent; border: none; color: #1ed760; font-size: 12px; cursor: pointer; font-weight: 600; padding: 0; display: flex; align-items: center; gap: 4px;" 
                            title="Tải lại captcha mới">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3c-3.31 0-6-2.69-6-6z"/>
                        </svg>
                        Tải lại
                    </button>
                </div>
            </div>

            <button type="submit">GỬI YÊU CẦU</button>
        </form>

        <div class="auth-links">
            <p>Nhớ ra mật khẩu rồi? <a th:href="@{/login}">Đăng nhập ngay</a></p>
        </div>
    </div>
</div>

<style>
    .captcha-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.08);
        padding: 6px;
        background: rgba(0, 0, 0, 0.3);
    }

    .captcha-cell {
        position: relative;
        aspect-ratio: 1;
        cursor: pointer;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid transparent;
        transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .captcha-cell:hover {
        border-color: rgba(255, 255, 255, 0.2);
        transform: scale(1.03);
    }

    .captcha-cell.selected {
        border-color: #1ed760;
        box-shadow: 0 0 12px rgba(30, 215, 96, 0.35), inset 0 0 0 1px rgba(30, 215, 96, 0.3);
    }

    .captcha-cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        user-select: none;
    }

    .captcha-check-overlay {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #1ed760;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(30, 215, 96, 0.4);
        animation: captcha-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .captcha-check-overlay svg {
        width: 14px;
        height: 14px;
    }

    .captcha-cell.selected .captcha-check-overlay {
        display: flex;
    }

    @keyframes captcha-pop {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }
</style>

<script>
    function toggleCaptchaCell(cell) {
        cell.classList.toggle('selected');
        const checkbox = cell.querySelector('.captcha-checkbox');
        if (checkbox) {
            checkbox.checked = cell.classList.contains('selected');
        }
    }
</script>

</body>
</html>
