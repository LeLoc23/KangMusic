# ============================================================
# SHARED CONFIGURATION (all environments)
# ============================================================

# Load local environment variables from .env when running from the project root.
spring.config.import=optional:file:.env[.properties]

# Upload directory — override per environment
app.upload.dir=./uploads/media

# App base URL — override in prod
app.base-url=http://localhost:8080

# Upload size limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Brevo transactional email API.
# Use a verified sender email in Brevo for real delivery.
brevo.api-url=https://api.brevo.com/v3/smtp/email
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:duongngocphu134@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:KangMusic}

# OpenAI API for chatbot and optional recommendation reranking.
openai.api-url=https://api.openai.com/v1/chat/completions
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.chat.enabled=${OPENAI_CHAT_ENABLED:true}
openai.recommendations.enabled=${OPENAI_RECOMMENDATIONS_ENABLED:true}

# Active profile — change to 'prod' on Railway / deployment
spring.profiles.active=dev
