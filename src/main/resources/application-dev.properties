# ============================================================
# DEVELOPMENT CONFIGURATION
# ============================================================

# Database: SQL Server for local development
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=KangMusic;encrypt=true;trustServerCertificate=true}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:kangmusic_user}
spring.datasource.password=${DB_PASSWORD:KangMusic@2026!}

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway is disabled in dev because Hibernate updates the local SQL Server schema.
spring.flyway.enabled=false

# H2 console is not used by the application runtime.
spring.h2.console.enabled=false

# Dev Upload Directory
app.upload.dir=./src/main/resources/static/media/

# Base URL for local dev
app.base-url=http://localhost:8080

# Tắt cache static resources trong dev (CSS, JS luôn reload mới nhất)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.thymeleaf.cache=false
